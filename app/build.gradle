plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cheat.overlay'
    compileSdk 33
    defaultConfig {
        applicationId "com.cheat.overlay"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
