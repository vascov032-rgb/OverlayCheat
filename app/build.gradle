plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cheat.overlay'
    compileSdk 33

    defaultConfig {
        applicationId "com.cheat.overlay"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    // Isso copia o executável C++ para os assets do APK
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

// Tarefa para copiar o binário compilado para a pasta assets
task copyDaemon(type: Copy) {
    from 'build/intermediates/cxx/Debug/*/obj/arm64-v8a/ff_daemon'
    into 'src/main/assets'
}
preBuild.dependsOn copyDaemon
